/* Volontairement compatible Safari iOS 9 : pas de CSS grid, pas de variables CSS, flexbox préfixé */
* { box-sizing: border-box; -webkit-box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #141110; color: #f4ede8;
  font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0); overflow: hidden; }
#app { height: 100%; padding: 2.2vh 1.8vw; display: -webkit-flex; display: flex;
  -webkit-flex-direction: column; flex-direction: column; }
.row { display: -webkit-flex; display: flex; -webkit-flex: 1; flex: 1; min-height: 0; }
.row + .row { margin-top: 2.2vh; }
.row.big { -webkit-flex: 1.25; flex: 1.25; }
.card { background: #221d1a; border-radius: 22px; padding: 2.6vh 2vw; position: relative;
  -webkit-flex: 1; flex: 1; min-width: 0; overflow: hidden; }
.card + .card { margin-left: 1.8vw; }
.wide { -webkit-flex: 1.6; flex: 1.6; }
.label { font-size: 1.9vh; text-transform: uppercase; letter-spacing: 0.15em; color: #a8988d; }
.label b { color: #e8673a; font-weight: normal; }

/* Horloge */
#clock { font-size: 15vh; font-weight: 200; line-height: 1; letter-spacing: -0.03em; margin-top: 1.4vh; }
#clock .sec { font-size: 4.4vh; color: #e8673a; margin-left: 0.6vw; vertical-align: top; }
#date { font-size: 3.4vh; color: #d9cdc4; margin-top: 1.4vh; }
#greet { font-size: 2.3vh; color: #a8988d; margin-top: 0.8vh; }

/* Météo */
.wx-now { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-top: 1.2vh; }
#wx-icon { font-size: 8.5vh; line-height: 1; margin-right: 1.5vw; }
#wx-temp { font-size: 8.5vh; font-weight: 200; line-height: 1; }
#wx-desc { font-size: 2.4vh; color: #d9cdc4; margin-top: 0.8vh; }
#wx-extra { font-size: 1.9vh; color: #a8988d; margin-top: 0.5vh; }
.days { display: -webkit-flex; display: flex; margin-top: 1.8vh; }
.day { -webkit-flex: 1; flex: 1; text-align: center; background: #2c2521; border-radius: 14px; padding: 1vh 0; }
.day + .day { margin-left: 0.8vw; }
.day .d { font-size: 1.7vh; color: #a8988d; }
.day .i { font-size: 3.2vh; margin: 0.3vh 0; }
.day .t { font-size: 1.8vh; }
.day .t span { color: #a8988d; }

/* Verset et invocation */
.text { position: absolute; top: 6.4vh; bottom: 5.4vh; left: 2vw; right: 2vw; overflow: hidden;
  display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
  -webkit-justify-content: center; justify-content: center; }
.ar { font-family: "AmiriQuran", "Geeza Pro", serif; direction: rtl; text-align: center;
  font-size: 1.75em; line-height: 1.95; color: #f4ede8; }
.ar .n { color: #e8673a; }
.fr { font-size: 1em; line-height: 1.45; color: #d9cdc4; text-align: center; margin-top: 0.9em; }
.fr.wait { color: #75685f; font-style: italic; }
.src { position: absolute; bottom: 2vh; left: 2vw; right: 2vw; font-size: 1.7vh; color: #8a7b71;
  text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Mode nuit */
#night { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; opacity: 0;
  pointer-events: none; -webkit-transition: opacity 2s; transition: opacity 2s; }
body.is-night #night { opacity: 0.72; }
#status { position: fixed; bottom: 0.6vh; right: 1.2vw; font-size: 1.4vh; color: #4a413b; }
</style>
</head>

<div id="app">
  <div class="row">
    <div class="card wide">
      <div class="label">Maintenant</div>

      <div id="date"></div>
      <div id="greet"></div>
    </div>
    <div class="card">
      <div class="label">Météo · <span id="wx-city"></span></div>
      <div class="wx-now"><div id="wx-icon">·</div><div id="wx-temp">--°</div></div>
      <div id="wx-desc">Chargement…</div>
      <div id="wx-extra"></div>
      <div class="days" id="wx-days"></div>
    </div>
  </div>
  <div class="row big">
    <div class="card wide">
      <div class="label"><b>۞</b>&nbsp; Verset du jour</div>
      <div class="text" id="verse"><div class="ar" id="verse-ar"></div><div class="fr" id="verse-fr"></div></div>
      <div class="src" id="verse-src"></div>
    </div>
    <div class="card">
      <div class="label"><b>☾</b>&nbsp; Invocation du jour</div>
      <div class="text" id="dua"><div class="ar" id="dua-ar"></div><div class="fr" id="dua-fr"></div></div>
      <div class="src" id="dua-src"></div>
    </div>
  </div>
</div>
<div id="night"></div>
<div id="status"></div>

/* Tout le JS est en ES5 (pas de let/const/=>/fetch) pour tourner sur iOS 9. */
var JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
var JOURS_C = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
var MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function getLS(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function setLS(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

/* ---------- Horloge ---------- */
var currentDay = null;
function tick() {
  var d = new Date(), h = d.getHours(), j = JOURS[d.getDay()];
  $("clock").innerHTML = pad(h) + ":" + pad(d.getMinutes()) + '<span class="sec">' + pad(d.getSeconds()) + "</span>";
  $("date").innerHTML = j.charAt(0).toUpperCase() + j.slice(1) + " " + d.getDate() + " " + MOIS[d.getMonth()] + " " + d.getFullYear();
  $("greet").innerHTML = h < 6 ? "Bonne nuit" : h < 12 ? "Bonjour" : h < 18 ? "Bon après-midi" : "Bonne soirée";
  var a = CONFIG.nuitDebut, b = CONFIG.nuitFin;
  document.body.className = (a > b ? (h >= a || h < b) : (h >= a && h < b)) ? "is-night" : "";
  var dayNum = Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000);
  if (dayNum !== currentDay) { currentDay = dayNum; showDaily(dayNum); }   // change à minuit
}

/* ---------- Ajuste la taille du texte pour qu'il tienne dans la carte ---------- */
function fit(box) {
  var size = window.innerHeight * 0.032, min = window.innerHeight * 0.014;
  box.style.fontSize = size + "px";
  while (box.scrollHeight > box.clientHeight + 1 && size > min) { size -= 0.5; box.style.fontSize = size + "px"; }
}
function fitAll() { fit($("verse")); fit($("dua")); }

/* ---------- Verset et invocation du jour ---------- */
var ARABIC_DIGITS = "٠١٢٣٤٥٦٧٨٩";
function arNum(n) { return String(n).replace(/[0-9]/g, function (c) { return ARABIC_DIGITS.charAt(+c); }); }
function showDaily(dayNum) {
  /* Verset */
  var v = VERSETS[dayNum % VERSETS.length], ar = "";
  for (var i = 0; i < v.ar.length; i++) ar += v.ar[i] + '&nbsp;<span class="n">﴿' + arNum(v.de + i) + "﴾</span> ";
  $("verse-ar").innerHTML = ar;
  $("verse-src").innerHTML = "Sourate " + esc(v.nom) + " (" + esc(v.sens) + ") · " + v.s + ":" + v.de +
    (v.a > v.de ? "-" + v.a : "") + " · trad. M. Hamidullah";
  $("verse-fr").className = "fr wait"; $("verse-fr").innerHTML = "Chargement de la traduction…";
  loadTranslation(v);
  /* Invocation : décalée pour ne pas suivre le même ordre que les versets */
  var d = INVOCATIONS[(dayNum * 7) % INVOCATIONS.length];
  $("dua-ar").innerHTML = d.ar;
  $("dua-fr").innerHTML = esc(d.fr);
  $("dua-src").innerHTML = esc(d.src);
  fitAll();
}

/* Traduction : mise en cache sur la tablette, puis 2 sources essayées l'une après l'autre */
function get(url, cb) {
  var x = new XMLHttpRequest();
  x.open("GET", url, true); x.timeout = 20000;
  x.onload = function () { var d = null; try { d = JSON.parse(x.responseText); } catch (e) {} cb(x.status === 200 && d ? d : null); };
  x.onerror = x.ontimeout = function () { cb(null); };
  x.send();
}
function loadTranslation(v) {
  var key = "tr_" + v.s + ":" + v.de + "-" + v.a, cached = getLS(key);
  if (cached) { setTranslation(cached); return; }
  var parts = [], n = v.a - v.de + 1, i = v.de;
  function next() {   /* source 1 : api.alquran.cloud, verset par verset */
    if (i > v.a) { var t = parts.join(" "); setLS(key, t); setTranslation(t); return; }
    get("https://api.alquran.cloud/v1/ayah/" + v.s + ":" + i + "/fr.hamidullah", function (d) {
      if (d && d.data && d.data.text) { parts.push(d.data.text); i++; next(); } else fallback();
    });
  }
  function fallback() {   /* source 2 : jsDelivr (sourate complète) */
    get("https://cdn.jsdelivr.net/npm/quran-json@3.1.2/dist/chapters/fr/" + v.s + ".json", function (d) {
      if (!d || !d.verses) { $("verse-fr").innerHTML = "Traduction indisponible (pas de connexion)"; fitAll(); return; }
      var out = [];
      for (var k = v.de; k <= v.a; k++) out.push(d.verses[k - 1].translation);
      var t = out.join(" "); setLS(key, t); setTranslation(t);
    });
  }
  next();
}
function setTranslation(t) { $("verse-fr").className = "fr"; $("verse-fr").innerHTML = esc(t); fitAll(); }

  61:["🌧","Pluie faible"],63:["🌧","Pluie"],65:["🌧","Forte pluie"],66:["🌧","Pluie verglaçante"],67:["🌧","Pluie verglaçante"],
  71:["🌨","Neige faible"],73:["🌨","Neige"],75:["❄️","Forte neige"],77:["🌨","Grains de neige"],
  80:["🌦","Averses"],81:["🌧","Averses"],82:["⛈","Fortes averses"],85:["🌨","Averses de neige"],86:["❄️","Averses de neige"],
  95:["⛈","Orage"],96:["⛈","Orage et grêle"],99:["⛈","Orage et grêle"]

function wx(code) { return WX[code] || ["🌡",""]; }
function loadWeather() {
  get("https://api.open-meteo.com/v1/forecast?latitude=" + CONFIG.latitude + "&longitude=" + CONFIG.longitude +
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5", function (data) {
    if (!data || !data.current) { $("wx-desc").innerHTML = "Météo indisponible"; return; }
    var c = data.current, w = wx(c.weather_code), dd = data.daily, html = "";
    $("wx-icon").innerHTML = w[0];
    $("wx-temp").innerHTML = Math.round(c.temperature_2m) + "°";
    $("wx-desc").innerHTML = w[1];
    $("wx-extra").innerHTML = "Ressenti " + Math.round(c.apparent_temperature) + "° · Vent " + Math.round(c.wind_speed_10m) + " km/h";
    for (var i = 1; i < dd.time.length; i++) {
      var p = dd.time[i].split("-"), day = new Date(+p[0], +p[1] - 1, +p[2]);
      html += '<div class="day"><div class="d">' + JOURS_C[day.getDay()] + '</div><div class="i">' + wx(dd.weather_code[i])[0] +
        '</div><div class="t">' + Math.round(dd.temperature_2m_max[i]) + "° <span>" + Math.round(dd.temperature_2m_min[i]) + "°</span></div></div>";
    }
    $("wx-days").innerHTML = html;
    var n = new Date(); $("status").innerHTML = "Météo à jour " + pad(n.getHours()) + ":" + pad(n.getMinutes());
  });
}

/* ---------- Démarrage ---------- */
document.addEventListener("touchmove", function (e) { e.preventDefault(); }, false);
$("wx-city").innerHTML = esc(CONFIG.ville);
tick(); setInterval(tick, 1000);
loadWeather(); setInterval(loadWeather, 15 * 60 * 1000);
/* La police arabe peut finir de charger après le premier affichage : on réajuste */
setTimeout(fitAll, 800); setTimeout(fitAll, 3000);
/* Recharge complète toutes les 6 h : évite que les vieux iPad saturent leur mémoire */
setTimeout(function () { location.reload(); }, 6 * 60 * 60 * 1000);
</script>
